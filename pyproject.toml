[project]
name = "munchkin-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.19",
    "aiohttp>=3.11.0,<3.11.14",
    "alembic>=1.15.2",
    "alembic-postgresql-enum>=1.7.0",
    "asyncpg>=0.30.0",
    "dotenv>=0.9.9",
    "fake-useragent>=2.2.0",
    "fastapi[standard]>=0.115.12",
    "pydantic<2.11",
    "pydantic-settings>=2.9.1",
    "redis>=5.2.1",
    "requests>=2.32.3",
    "sqlalchemy[asyncio]>=2.0.40",
    "sqlmodel>=0.0.24",
]

[dependency-groups]
dev = [
    "coverage>=7.8.0",
    "mypy>=1.15.0",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "ruff>=0.11.13",
]

[tool.mypy]
python_version = "3.13"
disallow_untyped_defs = true
show_error_codes = true
mypy_path = "src"
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
exclude = ["src.backend.migrations"]
plugins = ['pydantic.mypy']


[[tool.mypy.overrides]]
module = [
    "src.backend",
    "src.tg_bot",
]

[tool.ruff]
line-length=100
extend-exclude=["src/backend/migrations"]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # pydocstyle
    "D",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]
ignore=["D105", "D107", "D203", "D213"]

